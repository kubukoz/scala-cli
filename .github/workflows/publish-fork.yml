name: Publish fork binaries

on:
  push:
    branches:
      - fork-publish
  workflow_dispatch:

concurrency:
  group: publish-fork-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux-x86_64:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: true
      - uses: coursier/cache-action@v8
        with:
          ignoreJob: true
      - uses: VirtusLab/scala-cli-setup@v1
        with:
          jvm: "temurin:17"
      - name: Generate native launcher
        run: .github/scripts/generate-native-image.sh
      - name: Copy artifacts
        run: ./mill -i copyDefaultLauncher --directory artifacts/
      - name: Verify native launcher CPU compatibility
        run: .github/scripts/verify_old_cpus.sh artifacts/scala-cli-x86_64-pc-linux.gz
      - uses: actions/upload-artifact@v7
        with:
          name: linux-x86_64-launcher
          path: artifacts/scala-cli-x86_64-pc-linux.gz
          if-no-files-found: error
          retention-days: 2

  build-macos-arm64:
    runs-on: macOS-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: true
      - uses: coursier/cache-action@v8
        with:
          ignoreJob: true
      - uses: VirtusLab/scala-cli-setup@v1
        with:
          jvm: "https://github.com/graalvm/graalvm-ce-builds/releases/download/vm-22.2.0/graalvm-ce-java17-darwin-aarch64-22.2.0.tar.gz"
      - name: Ensure it's running on aarch64
        run: scala-cli -e 'assert(System.getProperty("os.arch") == "aarch64")'
      - name: Generate native launcher
        run: .github/scripts/generate-native-image.sh
      - name: Copy artifacts
        run: ./mill -i copyDefaultLauncher --directory artifacts/
      - uses: actions/upload-artifact@v7
        with:
          name: macos-arm64-launcher
          path: artifacts/scala-cli-aarch64-apple-darwin.gz
          if-no-files-found: error
          retention-days: 2

  release:
    needs:
      - build-linux-x86_64
      - build-macos-arm64
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: linux-x86_64-launcher
          path: artifacts/
      - uses: actions/download-artifact@v8
        with:
          name: macos-arm64-launcher
          path: artifacts/
      - name: Compute release tag
        id: tag
        run: echo "tag=fork-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$tag" \
            --notes "Automated fork build from commit $GITHUB_SHA on branch ${GITHUB_REF#refs/heads/}." \
            artifacts/scala-cli-x86_64-pc-linux.gz \
            artifacts/scala-cli-aarch64-apple-darwin.gz
